name: Codex E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-e2e:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020f # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Run the real Codex app-server integration suite
        run: npm test
