name: Feature request
description: Propose a workflow or product improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the user-visible behavior and expected outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Do not include credentials, private prompts, full local paths, or proprietary project content.
