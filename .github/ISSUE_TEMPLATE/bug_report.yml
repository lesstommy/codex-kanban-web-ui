name: Bug report
description: Report a reproducible problem in Codex Kanban Web UI.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private prompts, full local paths, or proprietary repository contents. Security vulnerabilities must follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0-alpha or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include macOS, Node.js, MongoDB, and Codex CLI versions.
      placeholder: macOS 15, Node 22.12.0, MongoDB 8.x, Codex CLI ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Include only the minimum relevant output after removing sensitive data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private prompts, full local paths, and proprietary project content.
          required: true
        - label: This is not a security vulnerability.
          required: true
